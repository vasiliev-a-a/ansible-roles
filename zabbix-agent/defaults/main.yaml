---
zabbix_agent_logrotate_config_file_name: "zabbix-agent"
zabbix_agent_logrotate_config_file: "{{ system_logrotate_config_directory }}/{{ zabbix_agent_logrotate_config_file_name }}"

zabbix_agent_role_config_file_name: "{{ origin }}"
zabbix_agent_role_config_file: "{{ zabbix_agent_config_directory }}/{{ zabbix_agent_role_config_file_name }}.conf"
zabbix_agent_role_config_extra: |

zabbix_agent_option_log_file: "/var/log/zabbix/zabbix_agentd.log"
zabbix_agent_option_pid_file: "/var/run/zabbix/zabbix_agentd.pid"
zabbix_agent_option_user: "zabbix"

zabbix_agent_sudoers_cmnd_list: ["/usr/bin/false"]
...
