---
- name: "undo: Stop Zabbix Agent service"
  ansible.builtin.service:
    name: "{{ zabbix_agent_service_name }}"
    state: stopped
    enabled: false
  when: ansible_check_mode == false
  ignore_errors: true

- name: "undo: Delete role configuration file"
  ansible.builtin.file:
    dest: "{{ zabbix_agent_role_config_file }}"
    state: absent

- name: "undo: Delete role configuration file backups"
  ansible.builtin.shell:
    cmd: "rm {{ zabbix_agent_role_config_file }}.*~"
    removes: "{{ zabbix_agent_role_config_file }}.*~"

- name: "undo: Delete drop-in configuration directory"
  ansible.builtin.file:
    dest: "{{ zabbix_agent_config_directory }}"
    state: absent

- name: "undo: Exclude drop-in directory from the main configuration file"
  ansible.builtin.lineinfile:
    backup: true
    path: "{{ zabbix_agent_config_file }}"
    regexp: "^[Ii]nclude={{ zabbix_agent_config_directory }}/*.conf"
    state: absent
    validate: "zabbix_agentd -c %s -t agent.hostname"

- name: "undo: Delete logrotate configuration file"
  ansible.builtin.file:
    dest: "{{ zabbix_agent_logrotate_config_file }}"
    state: absent

- name: "undo: Delete logrotate configuration file backups"
  ansible.builtin.shell:
    cmd: "rm {{ zabbix_agent_logrotate_config_file }}.*~"
    removes: "{{ zabbix_agent_logrotate_config_file }}.*~"

- name: "undo: Remove Zabbix Agent sudo configuration block"
  ansible.builtin.blockinfile:
    backup: true
    path: "{{ system_sudoers_config_file }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: origin={{ origin }}"
    state: absent
    validate: /usr/sbin/visudo -csf %s
  when: (system_sudoers_config_file['stat']['exists'] | default('true'))

- name: "undo: APT: Uninstall packages"
  ansible.builtin.apt:
    name: "{{ packages_install }}"
    state: absent
    update_cache: no
    purge: true
    autoremove: true
  when: (ansible_pkg_mgr | lower) == 'apt'

- name: "undo: Remove Zabbix Agent user account"
  ansible.builtin.user:
    name: "{{ zabbix_agent_option_user }}"
    state: absent
    remove: true
    force: true
...
