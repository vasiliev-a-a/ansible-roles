---
krb5_config_directory: "/etc/krb5.conf.d"
krb5_config_file: "/etc/krb5.conf"
samba_config_directory: "/etc/samba"
samba_config_file: "/etc/samba/smb.conf"
sssd_allow_groups:
 - "Администраторы домена"
 - "Domain Admins"
sssd_config_directory: "/etc/sssd/conf.d"
sssd_config_file: "/etc/sssd/sssd.conf"
sssd_krb5_config_snippet: "{{ krb5_config_directory }}/{{ snippet_name }}"
sssd_logrotate_config_snippet: "{{ logrotate_config_snippet }}"
sssd_samba_config_snippet: "{{ samba_config_directory }}/{{ snippet_name }}.conf"
sssd_sudoers_config_snippet: "{{ sudoers_config_snippet }}"
...
