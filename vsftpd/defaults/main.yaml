---
ftp_server_root: "/srv/ftproot"

ftp_server_user:
  name: ftp-user
  uid: 200

ftp_server_group:
  name: ftp-users
  gid: 200

ftp_users: []

vsftpd_logrotate_config_file_name: "{{ origin }}"
vsftpd_logrotate_config_file: "{{ system_logrotate_config_directory }}/{{ vsftpd_logrotate_config_file_name }}"

vsftpd_rsyslog_config_file_name: "{{ origin }}"
vsftpd_rsyslog_config_file: "{{ system_rsyslog_config_directory }}/{{ vsftpd_rsyslog_config_file_name }}.conf"
vsftpd_rsyslog_extra: |

vsftpd_config_file: "/etc/vsftpd.conf"
vsftpd_config_directory: "/etc/vsftpd.conf.d"
vsftpd_config_extra: |

vsftpd_option_listen_address: "0.0.0.0"
vsftpd_option_listen_port: 21
vsftpd_option_vsftpd_log_file: "/var/log/vsftpd.log"
vsftpd_option_pasv_min_port: 10000
vsftpd_option_pasv_max_port: 12000
vsftpd_option_rsa_cert_file: "{{ vsftpd_config_directory }}/cert.pem"
vsftpd_option_xferlog_file: "/var/log/xferlog"

vsftpd_rsa_cert_file: |
  -----CERTIFICATE CONTENT HERE----
...
