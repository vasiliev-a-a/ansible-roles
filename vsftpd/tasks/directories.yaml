---
- name: "directories: Create configuration directory"
  ansible.builtin.file:
    path: "{{ vsftpd_config_directory }}"
    state: directory
    mode: "0750"

- name: "directories: Create FTP root folder"
  ansible.builtin.file:
    path: "{{ ftp_server_root }}"
    state: directory
    mode: "0750"
    owner: root
    group: "{{ ftp_server_group['name'] }}"
  when: ansible_check_mode == false

- name: "directories: Create per `ftp_users` chroot directory"
  ansible.builtin.file:
    path: "{{ ftp_server_root }}/{{ item['name'] }}"
    state: directory
    mode: "2770"
    owner: "{{ item['name']}}"
    group: "{{ item['name']}}"
  loop: "{{ ftp_users | selectattr('role','equalto','user') }}"
  when:
    - ftp_users is defined
    - (ftp_users | count()) > 0
    - ansible_check_mode == false

- name: "directories: Enforce Chroot and SFTP for members of {{ ftp_server_group['name'] }}"
  ansible.builtin.blockinfile:
    backup: true
    block: |
      Match User {{ ftp_users | map(attribute='name') | join(',') }}
      ChrootDirectory {{ ftp_server_root }}
      ForceCommand internal-sftp -d /%u
      AllowTcpForwarding no
      AllowAgentForwarding no
      X11Forwarding no
      PermitTunnel no
    marker: "# {mark} ANSIBLE MANAGED BLOCK: origin={{ origin }}"
    insertafter: EOF
    path: "{{ system_sshd_config_file }}"
  notify: "restart sshd"
  when:
    - ftp_users is defined
    - (ftp_users | count()) > 0
...
