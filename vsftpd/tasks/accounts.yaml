---
- name: "accounts: Enable PAM umask"
  ansible.builtin.lineinfile:
    backup: true
    line: "session optional {{ pam_umask_module_name }}"
    path: "{{ pam_common_session_file }}"
    regexp: '^session[\ \t]+.*{{ pam_umask_module_name }}.*'

- name: "accounts: Create {{ ftp_server_group['name'] }} group"
  ansible.builtin.group:
    name: "{{ ftp_server_group['name'] }}"
    state: present
    gid: "{{ ftp_server_group['gid'] }}"

- name: "accounts: Create {{ ftp_server_user['name'] }} account"
  ansible.builtin.user:
    comment: "vsftpd service account"
    name: "{{ ftp_server_user['name'] }}"
    uid: "{{ ftp_server_user['uid'] }}"
    group: "{{ ftp_server_group['name']}}"
    password_lock: true
    shell: "/bin/bash"
    home: "{{ ftp_server_root }}"
    create_home: no

- name: "accounts: Create groups for `ftp_users`"
  ansible.builtin.group:
    name: "{{ item['name'] }}"
    state: present
    gid: "{{ item['id'] }}"
  loop: "{{ ftp_users }}"
  when:
    - ftp_users is defined
    - (ftp_users | count()) > 0

- name: "accounts: Create regular accounts for `ftp_users`"
  ansible.builtin.user:
    name: "{{ item['name'] }}"
    uid: "{{ item['id'] }}"
    group: "{{ item['name']}}"
    groups: "{{ ftp_server_group['name']}}"
    password: "{{ item['password'] | password_hash('sha512') }}"
    shell: "/bin/bash"
    home: "{{ ftp_server_root }}/{{ item['name'] }}"
    comment: ",,,,umask=0007"
    create_home: no
  loop: "{{ ftp_users | selectattr('role','equalto','user') }}"
  when:
    - ftp_users is defined
    - (ftp_users | count()) > 0

- name: "accounts: Create admin accounts for `ftp_users`"
  ansible.builtin.user:
    name: "{{ item['name'] }}"
    uid: "{{ item['id'] }}"
    group: "{{ item['name']}}"
    groups: "{{ ftp_users | map(attribute='name') | join(',') }},{{ ftp_server_group['name'] }}"
    password: "{{ item['password'] | password_hash('sha512') }}"
    shell: "/bin/bash"
    home: "{{ ftp_server_root }}"
    comment: ",,,,umask=0007"
    create_home: no
  loop: "{{ ftp_users | selectattr('role','equalto','admin') }}"
  when:
    - ftp_users is defined
    - (ftp_users | count()) > 0
...
